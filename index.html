<!DOCTYPE html>
<html lang="pl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formularz komunikacyjny dla partnerów – Sezon Francja–Polska 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brown:#3b1a1a;--red:#ff4426;--green:#1ce14a;--blue:#4586ff;--bg:#f4efe9;--line:#d9cdc2;--err:#c4331c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Fira Sans',system-ui,sans-serif;color:var(--brown);-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.5}
a{color:var(--brown)}a:hover{color:var(--red)}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top-in{height:96px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.wordmark{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:28px;line-height:1;color:var(--red)}
.top img{height:64px;width:auto;display:block}
.draft{font-size:14px;color:var(--brown)}
.hero{padding:56px 0 40px}
.hero h1{margin:0;font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:64px;line-height:.95;letter-spacing:-.01em;max-width:820px}
.hero p{margin:14px 0 0;font-size:19px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;align-items:start;padding-bottom:96px}
.steps{position:sticky;top:24px;display:flex;flex-direction:column;gap:4px}
.step{display:flex;gap:12px;align-items:center;background:none;border:0;padding:10px 12px;border-radius:12px;font:inherit;font-size:15px;color:var(--brown);text-align:left;cursor:pointer}
.step:hover{background:#fff}
.step .n{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--brown);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#fff}
.step.cur{background:#fff;font-weight:700}
.step.cur .n{background:var(--red)}
.step.done .n{background:var(--brown);color:#fff}
.step.bad .n{background:var(--err);border-color:var(--err);color:#fff}
.bar{display:none;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:var(--brown)}
.card{background:#fff;border-radius:24px;padding:40px}
.card+.card{margin-top:20px}
h2{margin:0 0 8px;font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:46px;line-height:1}
.kicker{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.req-note{font-size:15px;margin:0 0 28px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:26px}
.field:first-of-type{margin-top:0}
.lbl{font-weight:600;font-size:17px}
.lbl .star{color:var(--err)}
.help{font-size:15px;line-height:1.5;color:#5a3a33}
input[type=text],input[type=email],input[type=url],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:13px 15px;border:1.5px solid #c9bcb1;border-radius:12px;background:#fff;font:inherit;font-size:16px;color:var(--brown);outline:none}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(69,134,255,.25)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
.cnt{font-size:14px;align-self:flex-end}
.cnt.over{color:var(--err);font-weight:700}
.field.err input,.field.err select,.field.err textarea{border-color:var(--err)}
.msg{display:none;font-size:14px;font-weight:600;color:var(--err)}
.field.err .msg{display:block}
.grid{width:100%;border-collapse:collapse;font-size:15px}
.grid th{font-weight:600;padding:8px;text-align:center;width:120px}
.grid th:first-child{text-align:left;width:auto}
.grid td{padding:10px 8px;border-top:1px solid #efe7df;text-align:center}
.grid td:first-child{text-align:left}
.grid input{width:20px;height:20px;accent-color:var(--brown)}
.check{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;font-weight:600;cursor:pointer}
.check input{width:24px;height:24px;margin:0;accent-color:var(--brown)}
.intro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px}
.intro h3{margin:0 0 6px;font-size:18px}
.intro p{margin:0;font-size:16px}
.drive{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--green);border-radius:18px;padding:22px 26px;margin-top:28px}
.drive b{font-size:18px}
.drive .t{font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:15px 30px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--red);color:var(--brown)}
.btn:hover{background:#ff6a52;color:var(--brown)}
.btn:focus-visible,.step:focus-visible,.drop:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn.sec{background:transparent;border:2px solid var(--brown)}
.btn.sec:hover{background:#fff}
.btn.dark{background:var(--brown);color:#fff;white-space:nowrap}
.btn.dark:hover{background:#5a2a24;color:#fff}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:28px}
details.info{border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;margin-top:22px}
details.info summary{cursor:pointer;font-weight:700}
details.info p{margin:12px 0 0;font-size:15px}
.drop{margin-top:26px;border:2px dashed var(--brown);border-radius:20px;padding:36px 24px;text-align:center;cursor:pointer;background:#fbf8f5;transition:background .15s}
.drop.over{background:#eafbea;border-color:#1a8a3c}
.drop b{display:block;font-size:20px;margin-bottom:6px}
.drop span{font-size:15px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:16px}
.file{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;font-size:13px;position:relative}
.file .th{height:100px;background:repeating-linear-gradient(135deg,#ece3da 0 10px,#f4ede6 10px 20px);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.file .th img{width:100%;height:100%;object-fit:cover;display:block}
.file .nm{padding:8px 10px 2px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .sz{padding:0 10px 8px}
.file button{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--brown);color:#fff;font-size:16px;cursor:pointer;line-height:1}
.warn{margin-top:12px;font-size:14px;font-weight:600;color:var(--err)}
.legal{max-height:280px;overflow:auto;border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;font-size:15px;margin-top:20px;background:#fbf8f5}
.legal p{margin:0 0 12px}
.alert{background:var(--red);border-radius:14px;padding:14px 18px;font-weight:700;margin-bottom:20px}
.overlay{position:fixed;inset:0;background:rgba(59,26,26,.55);display:none;align-items:center;justify-content:center;z-index:9}
.overlay.on{display:flex}
.overlay .box{background:#fff;border-radius:24px;padding:36px 40px;width:min(480px,90vw)}
.overlay .pb{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:18px}
.overlay .pb i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.done-ic{width:76px;height:76px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;margin-bottom:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sub{margin:44px 0 0;padding-top:28px;border-top:1.5px solid var(--line);font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:30px;line-height:1.05}
.req-note+.sub{margin-top:8px;border-top:0;padding-top:0}
.sub+.field{margin-top:18px}
.legal+.field{margin-top:20px}
h2[tabindex]:focus{outline:none}
.btn{white-space:nowrap;flex-shrink:0}
.nav{flex-wrap:wrap;row-gap:12px}
.nav-r{margin-left:auto}
@media (max-width:640px){.nav>.btn.sec{order:2}.nav-r{width:100%;flex-direction:column-reverse;align-items:stretch}.nav-r .btn{justify-content:center}}
.fsum{margin-top:18px;font-size:15px;font-weight:600}
.flist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.fi{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.fi .th{width:64px;height:48px;border-radius:8px;overflow:hidden;background:repeating-linear-gradient(135deg,#ece3da 0 8px,#f4ede6 8px 16px);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.fi .th img{width:100%;height:100%;object-fit:cover;display:block}
.fi .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .sz{font-size:13px}
.pbar{height:6px;background:#efe7df;border-radius:3px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--brown);transition:width .2s}
.fi.done .pbar i{background:#1a8a3c}
.fi.err,.fi.big{border-color:var(--err)}
.fi.err .sz,.fi.big .sz{color:var(--err);font-weight:600}
.fi.err .pbar i,.fi.big .pbar i{background:var(--err)}
.x{width:32px;height:32px;border-radius:50%;border:0;background:var(--brown);color:#fff;font-size:18px;cursor:pointer;line-height:1}
.mini{border:2px solid var(--brown);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;font-weight:700;color:var(--brown);cursor:pointer}
.nav-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn.ghost{background:transparent;text-decoration:underline;padding:15px 12px}
.btn.ghost:hover{background:transparent;color:var(--err)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--brown);color:#fff;padding:14px 20px;border-radius:14px;font-size:15px;line-height:1.45;max-width:min(560px,92vw);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--err)}
@media (max-width:860px){
  .top-in{height:72px}.top img{height:44px}
  .layout{grid-template-columns:minmax(0,1fr);gap:0}
  .steps{display:none}.bar{display:block}
  .hero h1{font-size:44px}.card{padding:26px 20px;border-radius:18px}
  .two,.intro{grid-template-columns:minmax(0,1fr)}
  .drive{flex-direction:column;align-items:flex-start}
  .grid th{width:auto;font-size:13px}
}
</style>
</head>

    if (a === 'load') return null;
    return { ok: true };
  }
  const r = await fetch(KONFIG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ a: a }, data)) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
function ensureToken() {
  if (token) return Promise.resolve(token);

function missingOn(s) {
  const out = [], okFiles = files.filter(f => f.status === 'queue' || f.status === 'up' || f.status === 'done').length;

  cur = k; visited[k] = true; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => { const f = document.querySelector('.field.err input, .field.err textarea, .field.err select'); if (f) f.focus(); else { const h2 = $('page').querySelector('h2'); if (h2) h2.focus(); } }, 60);
}
function syncServer() { if (token && !DEMO) api('save', { token: token, email: vals.email, vals: vals }).catch(() => {}); }

/* ---------- zdarzenia ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(+g.dataset.go); return; }
  if (e.target.closest('[data-next]')) {
    if (cur === 0) { tried.email = true; if (emailBad()) { render(); const f = $('email'); if (f) f.focus(); return; } }
    else { tried[cur - 1] = true; if (missingOn(cur - 1).length) { render(); const f = document.querySelector('.field.err input, .field.err textarea, .field.err select'); if (f) f.focus(); return; } }
    syncServer(); go(cur + 1); return;
  }
  const rt = e.target.closest('[data-retry]'); if (rt) { const f = files[+rt.dataset.retry]; f.status = 'queue'; f.pct = 0; drawFiles(); pump(); return; }
  const rm = e.target.closest('[data-rm]');
  if (rm) {
    const f = files.splice(+rm.dataset.rm, 1)[0];
    if (f.url) URL.revokeObjectURL(f.url);
    if (f.status === 'done' && f.id && token && !DEMO) api('removeFile', { token: token, id: f.id }).catch(() => {});
    drawFiles(); persist(); return;
  }
  if (e.target.closest('#later')) { saveLater(); return; }
  if (e.target.closest('#send')) send();
});
document.addEventListener('input', e => {
  const t = e.target, id = t.dataset.f; if (!id) return;
  if (t.type === 'radio') { vals[id] = vals[id] || {}; vals[id][t.dataset.r] = +t.value; }
  else if (t.type === 'checkbox') vals[id] = t.checked;
  else vals[id] = t.value;
  const c = document.querySelector('[data-cnt="' + id + '"]');
  if (c) { const n = t.value.length, max = +c.dataset.max; c.textContent = n + ' / ' + max + ' znaków'; c.classList.toggle('over', n > max); }
  const fld = t.closest('.field'); if (fld) fld.classList.remove('err');
  persist();
});

/* ---------- pliki ---------- */
function addFiles(list) {
  let skipped = 0;
  Array.from(list).forEach(f => {
    if (files.length >= KONFIG.maxPlikow || !f.size) { skipped++; return; }
    files.push({ key: rk(), file: f, name: f.name, size: f.size, type: f.type || 'application/octet-stream', status: f.size > KONFIG.maxGB * 1073741824 ? 'big' : 'queue', pct: 0, url: /^image\/(jpeg|png|gif|webp)/.test(f.type) ? URL.createObjectURL(f) : '' });
  });
  if (skipped) toast('Pominięto pliki: ' + skipped + ' (puste lub ponad limit ' + KONFIG.maxPlikow + ' plików).', 1);
  drawFiles(); pump();
}
function pump() {
  while (uploading < 2) {
    const it = files.find(f => f.status === 'queue'); if (!it) break;
    uploading++; it.status = 'up'; it.pct = 0; drawFiles();
    upload(it).then(() => { it.status = 'done'; it.pct = 100; }).catch(err => { it.status = 'err'; it.msg = err.message; })
      .finally(() => { uploading--; drawFiles(); persist(); pump(); });
  }
}
async function upload(it) {
  if (!it.file) throw new Error('Dodaj plik ponownie');
  await ensureToken();
  if (DEMO) { for (let p = 0; p <= 100; p += 5) { it.pct = p; setPct(it); await new Promise(r => setTimeout(r, Math.min(300, 40 + it.size / 4e6))); } it.id = 'demo'; return; }
  let url = null;
  try { url = (await api('upload', { token: token, name: it.name, type: it.type, size: it.size })).url; }
  catch (e) { if (it.size > SMALL) throw e; }
  if (url) {
    try { it.id = await putChunks(url, it); return; }
    catch (e) { if (it.size > SMALL || e.status) throw e; }
  }
  it.pct = 50; setPct(it);
  it.id = (await api('uploadSmall', { token: token, name: it.name, type: it.type, data: await b64(it.file) })).id;
}
function putChunks(url, it) {
  const CH = 16 * 1048576, size = it.size;
  return new Promise((ok, ko) => {
    let start = 0, tries = 0;
    const next = () => {
      const end = Math.min(start + CH, size), x = new XMLHttpRequest();
      x.open('PUT', url);
      x.setRequestHeader('Content-Range', 'bytes ' + start + '-' + (end - 1) + '/' + size);
      x.upload.onprogress = e => { it.pct = Math.min(99, Math.round((start + e.loaded) / size * 100)); setPct(it); };
      x.onload = () => {
        if (x.status === 308) { start = end; tries = 0; next(); }
        else if (x.status === 200 || x.status === 201) { try { ok(JSON.parse(x.responseText).id); } catch (e) { ok(''); } }
        else if (x.status >= 500 && tries++ < 3) setTimeout(next, 1500 * tries);
        else { const er = new Error('serwer odrzucił plik (' + x.status + ')'); er.status = x.status; ko(er); }
      };
      x.onerror = () => {
        if (start > 0 && tries++ < 5) setTimeout(next, 2000 * tries);
        else { const er = new Error('brak połączenia'); er.status = 0; ko(er); }
      };
      x.send(it.file.slice(start, end));
    };
    next();
  });
}
const b64 = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ko; r.readAsDataURL(f); });
function bindDrop() {
  const d = $('drop'); if (!d) return; const fi = $('fi');
  d.addEventListener('click', () => fi.click());
  d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } });
  fi.addEventListener('change', () => { addFiles(fi.files); fi.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove('over'); }));
  d.addEventListener('drop', e => addFiles(e.dataTransfer.files));
}

/* ---------- zapis, wysyłka ---------- */
async function saveLater() {
  if (emailBad()) { tried.email = true; go(0); return; }
  try {
    await ensureToken();
    await api('save', { token: token, email: vals.email, vals: vals, link: true });
    persist();
    toast('Wysłaliśmy link do dokończenia formularza na adres ' + vals.email + '. Przesłane pliki są zapisane.');
  } catch (err) { toast('Nie udało się zapisać: ' + err.message, 1); }
}
async function send() {
  tried.email = true; SEK.forEach((_, s) => { tried[s] = true; });
  if (emailBad()) { go(0); return; }
  const bad = SEK.findIndex((_, s) => missingOn(s).length);
  if (bad >= 0) { go(bad + 1); return; }
  if (files.some(f => f.status === 'queue' || f.status === 'up')) { go(UP + 1); toast('Poczekaj, aż wszystkie pliki się prześlą.', 1); return; }
  if (files.some(f => f.status === 'err' || f.status === 'big')) { go(UP + 1); toast('Usuń pliki oznaczone na czerwono albo ponów ich przesyłanie.', 1); return; }
  const ov = $('ov'); $('ovS').textContent = 'To potrwa kilka sekund.'; ov.classList.add('on');
  try {
    await ensureToken();
    const pola = [];
    SEK.forEach((S, s) => S.p.forEach((p, i) => p[0] !== 'S' && pola.push({ t: p[1], v: value(s, i), tl: !!p[5] })));
    const res = await api('submit', { token: token, email: vals.email, pola: pola });
    const tytul = value(0, 0);
    try { localStorage.removeItem(KEY); } catch (e) {}
    ov.classList.remove('on');
    done(res.nr, tytul);
  } catch (err) {
    ov.classList.remove('on');
    toast('Nie udało się wysłać zgłoszenia: ' + err.message + ' Odpowiedzi są zapisane, spróbuj ponownie za chwilę.', 1);
  }
}
function done(nr, tytul) {
  $('steps').innerHTML = ''; $('bar').style.display = 'none';
  $('page').innerHTML = '<div class="card"><div class="done-ic">✓</div><h2 tabindex="-1">Dziękujemy!</h2><p style="font-size:19px;margin:16px 0 0">Zgłoszenie <b>„' + esc(tytul) + '”</b> zostało wysłane (nr ' + esc(nr) + '). Potwierdzenie wysłaliśmy na adres <b>' + esc(vals.email) + '</b>.</p><p style="margin:12px 0 0">Kolejne wydarzenie zgłoś w nowym formularzu. Poprawki prześlij na adres ' + esc(KONFIG.emailKontakt) + ', podając numer zgłoszenia.</p><div style="margin-top:28px"><button class="btn sec" id="again">Zgłoś kolejne wydarzenie</button></div></div>';
  $('page').querySelector('h2').focus();
  $('again').onclick = () => { vals = { email: vals.email }; files = []; token = null; tried = {}; visited = { 0: true }; persist(); $('bar').style.display = ''; go(1); };
  window.scrollTo({ top: 0 });
}

async function init() {
  const sz = new URLSearchParams(location.search).get('szkic');
  if (sz) {
    try {
      const r = await api('load', { token: sz });
      if (r) { token = sz; vals = Object.assign({}, r.vals); files = (r.files || []).map(f => Object.assign({}, f, { key: rk(), status: 'done', pct: 100 })); persist(); toast('Wczytaliśmy zapisany formularz nr ' + r.nr + '.'); }
    } catch (err) { toast(err.message, 1); }
    history.replaceState(null, '', location.pathname);
  }
  render();
}
init();
</script>
